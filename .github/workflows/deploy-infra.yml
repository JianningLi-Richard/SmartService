# Redeploys infra/main.bicep whenever infra/ changes on main.
# deploy.sh (not a raw `az deployment group create`) is what reads back
# AI_FOUNDRY_AGENT_ID / device-keys / WEBSITE_RUN_FROM_PACKAGE from the live
# app first -- without that, this workflow would silently wipe them on every run.
name: Deploy infrastructure

on:
  workflow_dispatch: # lets you force a redeploy from the Actions tab without touching infra/
  push:
    branches: [main]
    paths:
      - 'infra/**' # only fires when infra actually changed -- backend/dashboard-only pushes skip this

permissions:
  id-token: write # required for OIDC login below; no client secret is ever stored
  contents: read

env:
  RESOURCE_GROUP: rg-smartservice-demo
  LOCATION: canadacentral

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Exchanges a short-lived GitHub-signed token for Azure access via the
      # federated credential set up by infra/setup-federated-identity.sh.
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep
        run: infra/deploy.sh "$RESOURCE_GROUP" "$LOCATION"
