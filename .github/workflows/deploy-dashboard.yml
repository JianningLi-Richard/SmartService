# Redeploys the static staff dashboard whenever dashboard/ changes.
# Unlike the other two workflows, this one also runs on pull_request so Static
# Web Apps can spin up a preview environment for review -- and the `action`
# expression below tears that preview down again once the PR is closed.
name: Deploy dashboard (Static Web App)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
  pull_request:
    branches: [main]
    paths:
      - 'dashboard/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Auth here is a Static Web Apps deployment token (not OIDC like the other
      # two workflows) -- SWA's own deploy mechanism doesn't support federated
      # identity, so this one secret has to be a stored credential.
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          # 'close' tears down the PR preview on merge/close; every other
          # trigger (push to main, workflow_dispatch, PR open/sync) uploads.
          action: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && 'close' || 'upload' }}
          app_location: 'dashboard'
          output_location: ''
          skip_app_build: true # plain static HTML/JS -- nothing to build
